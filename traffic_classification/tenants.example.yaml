# Test tenants and buckets. Copy to tenants.local.yaml (gitignored).
# List of tenants applied by the "apply" command (created if missing).

# Fields:
#   name        Required. Tenant name; doubles as an application ID (e.g. appid_001).
#   password    Required if buckets is set. (Re)set on the tenant root user every run.
#   buckets     Optional. Bucket names (S3 rules: lowercase, hyphens, no underscores).

- name: appid_001
  password: Netapp1!Tenant
  buckets:
    - appid-001-data
    - appid-001-logs

- name: appid_002
  password: Netapp1!Tenant
  buckets:
    - appid-002-data

