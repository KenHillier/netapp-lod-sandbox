# Copy to policies.local.yaml (gitignored).
# Simple form:
#   name        required
#   description optional
#   bucket      optional matcher
#   tenant_name optional matcher (resolved to the tenant account id)
#   tenant      optional matcher (account id directly)
#   ip          optional matcher (IP or CIDR)
#   limit       optional; omit for monitor-only
#   limit_type  required if limit is set
#
# Omit all matcher keys to match the whole grid.
# Advanced form: use raw "matchers" and "limits" keys for full control.

- name: monitor-grid
  description: Monitor-only grid policy

- name: monitor-tenant-appid-001
  description: Monitor-only tenant policy
  tenant_name: appid_001

- name: monitor-bucket-appid-001-data
  description: Monitor-only bucket policy
  bucket: appid-001-data

- name: ingest-limit
  description: Demo ingest limit
  bucket: my-bucket
  limit: 10485760
  limit_type: aggregateBandwidthIn

- name: tenant-egress-limit-appid-001
  description: Demo egress limit
  tenant_name: appid_001
  limit: 5242880
  limit_type: aggregateBandwidthOut

